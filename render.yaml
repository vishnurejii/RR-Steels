services:
  - type: web
    name: rr-steels
    env: docker
    plan: free
    region: singapore
    envVars:
      - key: APP_DEBUG
        value: "false"
      - key: APP_ENV
        value: production
      - key: DB_CONNECTION
        value: mongodb
      - key: MONGODB_DATABASE
        value: steel_retail
      - key: APP_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
